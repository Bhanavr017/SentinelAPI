services:
  - type: web
    name: sentinelapi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PROJECT_NAME
        value: SentinelAPI
      - key: VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"
      - key: JWT_ALGORITHM
        value: RS256
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_KID
        value: sentinelapi
      - key: JWT_ISSUER
        value: SentinelAPI
      - key: JWT_AUDIENCE
        value: SentinelAPI
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_PER_HOUR
        value: "1000"
      - key: BLOCK_THRESHOLD
        value: "5"
      - key: BLOCK_DURATION
        value: "3600"
      - key: UPSTREAM_BASE_URL
        value: https://httpbin.org
      - key: GATEWAY_TIMEOUT_SECONDS
        value: "10"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelapi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sentinelapi-redis
          property: connectionString
  - type: keyvalue
    name: sentinelapi-redis
    plan: free
    ipAllowList: []
databases:
  - name: sentinelapi-db
    databaseName: sentinelapi
    plan: free
